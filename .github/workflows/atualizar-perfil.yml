name: Atualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: false

jobs:
  cobra:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#be123c&color_dots=#ebedf0,#fecdd3,#fb7185,#e11d48,#881337
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e11d48&color_dots=#161b22,#3b0764,#6b21a8,#9f1239,#e11d48

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contribuicoes-3d-e-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Salvar grafico 3D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "Atualiza grafico 3D de contribuicoes"
          git push

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCTg7ZE8AptmvPkbvfSWPoWg"
          max_post_count: 4
          custom_tags: "channelId/yt:channelId/,videoId/yt:videoId/"
          template: '<a href="$url"><img width="24%" src="https://i.ytimg.com/vi/$videoId/mqdefault.jpg" alt="$title" title="$title" /></a> '
          commit_message: "Atualiza ultimos videos do YouTube"
